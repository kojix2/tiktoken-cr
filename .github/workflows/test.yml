name: test

on: [push, pull_request]

jobs:
  test:
    name: ${{ matrix.os }} / Crystal ${{ matrix.crystal }}
    runs-on: ${{ matrix.os }}-latest
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu, macos, windows]
        crystal: [latest]
    steps:
      - uses: actions/checkout@v7
      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: ${{ matrix.crystal }}
      - name: Install CLI example
        working-directory: examples/count_tokens
        run: shards install
      - name: Build CLI example
        working-directory: examples/count_tokens
        run: shards build count_tokens
      - name: Install native library for specs
        run: crystal run scripts/install.cr
      - name: Run specs
        run: crystal spec
